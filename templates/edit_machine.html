{% extends "base.html" %}

{% block title %}Edit Mesin - Dashboard Water Level{% endblock %}

{% block content %}
<style>
    .form-container {
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-width: 600px;
        margin: 0 auto;
    }

    .form-title {
        font-size: 24px;
        font-weight: 600;
        color: #333;
        margin-bottom: 30px;
        text-align: center;
        padding-bottom: 15px;
        border-bottom: 2px solid #e0e0e0;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 16px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
        background-color: #f9f9f9;
    }

    .form-control:focus {
        outline: none;
        border-color: #2196F3;
        background-color: white;
        box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    .form-control:disabled {
        background-color: #e9ecef;
        color: #6c757d;
        cursor: not-allowed;
    }

    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
    }

    .btn {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 130px;
        justify-content: center;
        text-decoration: none;
        border: none;
    }

    .btn-primary {
        background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
    }

    .btn-secondary {
        background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        color: white;
    }

    .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }

    .btn:active {
        transform: translateY(0);
    }

    .machine-id-display {
        background-color: #e3f2fd;
        border: 2px solid #2196F3;
        color: #1976D2;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .form-container {
            padding: 20px;
            margin: 15px;
        }
        
        .button-group {
            flex-direction: column;
        }
        
        .btn {
            min-width: 100%;
        }
    }
</style>

<div class="form-container">
    <h2 class="form-title">
        <i class="fas fa-edit"></i>
        Edit Mesin
    </h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="id_mesin">ID Mesin</label>
            <input type="text" 
                   id="id_mesin" 
                   name="id_mesin" 
                   class="form-control machine-id-display" 
                   value="{{ machine[0] }}"
                   disabled
                   readonly>
            <small style="color: #6c757d; font-size: 14px; margin-top: 5px; display: block;">
                ID Mesin tidak dapat diubah
            </small>
        </div>
        
        <div class="form-group">
            <label for="nama_mesin">Nama Mesin</label>
            <input type="text" 
                   id="nama_mesin" 
                   name="nama_mesin" 
                   class="form-control" 
                   value="{{ machine[1] }}"
                   placeholder="Masukkan nama mesin"
                   required>
        </div>
        
        <div class="form-group">
            <label for="lokasi">Lokasi</label>
            <input type="text" 
                   id="lokasi" 
                   name="lokasi" 
                   class="form-control" 
                   value="{{ machine[2] }}"
                   placeholder="Masukkan lokasi mesin"
                   required>
        </div>
        
        <div class="button-group">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i>
                Simpan Perubahan
            </button>
            
            <a href="{{ url_for('add_machine') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i>
                Batal
            </a>
        </div>
    </form>
</div>

<script>
// Auto focus on nama_mesin field
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('nama_mesin').focus();
});

// Form validation
document.querySelector('form').addEventListener('submit', function(e) {
    const namaMesin = document.getElementById('nama_mesin').value.trim();
    const lokasi = document.getElementById('lokasi').value.trim();
    
    if (!namaMesin || !lokasi) {
        e.preventDefault();
        alert('Semua field harus diisi!');
        return false;
    }
    
    // Show loading state
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    submitBtn.disabled = true;
    
    // Re-enable button after 3 seconds in case of error
    setTimeout(() => {
        if (submitBtn.disabled) {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    }, 3000);
});

// Escape key to cancel
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        if (confirm('Batalkan perubahan dan kembali ke daftar mesin?')) {
            window.location.href = "{{ url_for('add_machine') }}";
        }
    }
});
</script>

{% endblock %}
